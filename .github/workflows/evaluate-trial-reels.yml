name: Evaluate Trial Reels

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/evaluate_reels.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Commit trial state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add trial_state.json
          git diff --staged --quiet || git commit -m "Update trial reel evaluation state [skip ci]"
          git push
