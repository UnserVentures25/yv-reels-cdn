name: Daily Trial Reels

on:
  schedule:
    # 7 Reels pro Tag, mind. 2 h Abstand: stuendlich loeste Metas Drosselung
    # aus ("Trial Reel Publish Limit Exceeded", 13.09.26).
    # Minute :23, damit es nicht mit scheduled-posting (:07) kollidiert und
    # nicht auf die volle Stunde faellt (GitHub verwirft :00-Crons oft).
    # UTC -> CEST: 07:23, 09:23, 12:23, 15:23, 17:23, 19:23, 21:23
    - cron: "23 5,7,10,13,15,17,19 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-trial-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/post_daily.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CROSSPOST_FACEBOOK: "true"
      - name: Commit updated state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add state.json trial_state.json
          git diff --staged --quiet || git commit -m "Update posting state [skip ci]"
          git pull --rebase origin main
          git push
