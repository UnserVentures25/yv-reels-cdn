name: Daily Trial Reels

on:
  schedule:
    # 1 Reel pro Tag (17.09.26, war 7). Insights-Auswertung vom 17.09.:
    # Median-Reach 1.407 bei 1-2 Posts/Tag gegen 120 bei 5-9 Posts/Tag.
    # Zweiter Slot nur als Nachholung, falls der erste ausfaellt -
    # MAX_POSTS_PER_24H=1 in post_daily.py laesst ihn sonst durchfallen.
    # Minute :23, damit es nicht mit scheduled-posting (:07) kollidiert und
    # nicht auf die volle Stunde faellt (GitHub verwirft :00-Crons oft).
    # UTC -> CEST: 07:23 (Haupt-Slot), 17:23 (Nachholung)
    - cron: "23 5,15 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-trial-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sparse: Repo ist >1 GB (MP4s/JPGs). Die Workflows brauchen nur Code
      # und State — Meta laedt die Medien direkt vom CDN.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            automation
            *.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/post_daily.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CROSSPOST_FACEBOOK: "true"
      - name: Commit updated state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add state.json trial_state.json
          git diff --staged --quiet || git commit -m "Update posting state [skip ci]"
          git pull --rebase origin main
          git push
