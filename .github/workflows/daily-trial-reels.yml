name: Daily Trial Reels

on:
  # Zeitplan laeuft jetzt extern ueber cron-job.org (GitHubs eigener
  # schedule-Trigger war unzuverlaessig, ist deshalb entfernt, um
  # Doppel-Posts zu vermeiden).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/post_daily.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CROSSPOST_FACEBOOK: "true"
      - name: Commit updated state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add state.json trial_state.json
          git diff --staged --quiet || git commit -m "Update posting state [skip ci]"
          git push
