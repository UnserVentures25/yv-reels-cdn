name: Daily Trial Reels

on:
  schedule:
    # :11 statt :00 — GitHub verwirft Crons zur vollen Stunde bei Lastspitzen.
    # Der 45-min-Guard in post_daily.py verhindert Doppel-Posts, falls der
    # alte externe cron-job.org-Trigger (:00) noch feuert.
    - cron: "11 * * * *"  # 1x pro Stunde, 1 Trial Reel pro Lauf (REELS_PER_TRIGGER in post_daily.py)
  workflow_dispatch: {}

concurrency:
  group: daily-trial-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/post_daily.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CROSSPOST_FACEBOOK: "true"
      - name: Commit updated state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add state.json trial_state.json
          git diff --staged --quiet || git commit -m "Update posting state [skip ci]"
          git pull --rebase origin main
          git push
