name: Scheduled Posting

on:
  schedule:
    # Versetzte Minuten: GitHub verwirft/verzoegert Crons zur vollen Stunde
    # bei Lastspitzen (12.09. fiel der 8:00-UTC-Slot komplett aus).
    # Ein Haupt-Slot + zwei Nachhol-Slots. post_scheduled.py prueft
    # das Berliner Datum im State: war der Tag schon erledigt, bricht der
    # Nachhol-Lauf sofort ab (kein Doppelpost).
    - cron: "7 8 * * *"   # ~10:07 CEST -> Karussell (Haupt-Slot)
    - cron: "37 9 * * *"  # ~11:37 CEST -> Karussell (Nachholung 1)
    - cron: "7 11 * * *"  # ~13:07 CEST -> Karussell (Nachholung 2)
  workflow_dispatch:
    inputs:
      mode:
        description: "carousel | best_reel (best_reel nur manuell, Cron abgeschaltet 22.09.26)"
        required: false

concurrency:
  group: scheduled-posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Sparse: Repo ist >1 GB (MP4s/JPGs). Die Workflows brauchen nur Code
      # und State — Meta laedt die Medien direkt vom CDN.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            automation
            *.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Determine mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=carousel" >> "$GITHUB_OUTPUT"
          fi
      - run: python3 automation/post_scheduled.py
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          # Manueller Lauf umgeht die Tagespruefung, Cron-Laeufe nie.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Commit updated state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add carousel_state.json best_reel_posted.json
          git diff --staged --quiet || git commit -m "Update scheduled-posting state [skip ci]"
          git pull --rebase origin main
          git push
