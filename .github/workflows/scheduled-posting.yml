name: Scheduled Posting

on:
  schedule:
    # Versetzte Minuten: GitHub verwirft/verzoegert Crons zur vollen Stunde
    # bei Lastspitzen (12.09. fiel der 8:00-UTC-Slot komplett aus).
    - cron: "7 8 * * *"   # ~10:07 CEST -> Karussell
    - cron: "7 12 * * *"  # ~14:07 CEST -> bester Reel als Normal-Post
  workflow_dispatch:
    inputs:
      mode:
        description: "carousel | best_reel (nur fuer manuellen Testlauf)"
        required: false

concurrency:
  group: scheduled-posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Determine mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 8 * * *" ]; then
            echo "mode=carousel" >> "$GITHUB_OUTPUT"
          else
            echo "mode=best_reel" >> "$GITHUB_OUTPUT"
          fi
      - run: python3 automation/post_scheduled.py
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Commit updated state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add carousel_state.json best_reel_posted.json
          git diff --staged --quiet || git commit -m "Update scheduled-posting state [skip ci]"
          git pull --rebase origin main
          git push
