name: Export Insights

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Sparse: Repo ist >1 GB (MP4s/JPGs). Die Workflows brauchen nur Code
      # und State — Meta laedt die Medien direkt vom CDN.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            automation
            *.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/export_insights.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: insights-export
          path: insights_export.json
          retention-days: 3
