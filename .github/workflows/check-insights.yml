name: Check Online Followers

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Sparse: Repo ist >1 GB (MP4s/JPGs). Die Workflows brauchen nur Code
      # und State — Meta laedt die Medien direkt vom CDN.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            automation
            *.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/check_online_followers.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
