name: Reply to Comments

on:
  schedule:
    - cron: "30 6,9,12,15,18,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 automation/reply_comments.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Commit replied-comments state
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add replied_comments.json
          git diff --staged --quiet || git commit -m "Update replied comments [skip ci]"
          git push
