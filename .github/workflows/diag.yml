name: Token Diagnose

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Scopes und Publishing-Limit pruefen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ["IG_ACCESS_TOKEN"]; uid = os.environ["IG_USER_ID"]
          def get(url):
              try:
                  with urllib.request.urlopen(url) as r: return json.load(r)
              except Exception as e:
                  body = e.read().decode() if hasattr(e, "read") else str(e)
                  return {"FEHLER": body[:500]}
          d = get(f"https://graph.facebook.com/v20.0/debug_token?input_token={tok}&access_token={tok}").get("data", {})
          print("VALID  :", d.get("is_valid"))
          print("TYPE   :", d.get("type"))
          print("EXPIRES:", d.get("expires_at"))
          print("SCOPES :", ", ".join(d.get("scopes", [])) or "KEINE")
          print()
          lim = get(f"https://graph.facebook.com/v20.0/{uid}/content_publishing_limit?fields=quota_usage,config&access_token={tok}")
          print("PUBLISHING LIMIT:", json.dumps(lim)[:400])
          print()
          acc = get(f"https://graph.facebook.com/v20.0/{uid}?fields=id,username,account_type&access_token={tok}")
          print("ACCOUNT:", json.dumps(acc)[:300])
          PY
